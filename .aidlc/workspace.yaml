name: keymesh
version: "1.0"
artifact_language: vi
agents:
  - id: aidlc-native-originator
    name: Native Originator
    skills:
      - aidlc-native-intent
    model: opus
    description: native-originator persona — handles intent
    capabilities:
      - jira
      - core-business
      - web
  - id: aidlc-native-product-owner
    name: Native Product Owner
    skills:
      - aidlc-native-spec
    model: opus
    description: native-product-owner persona — handles spec
    capabilities:
      - jira
      - figma
      - core-business
      - web
  - id: aidlc-native-engineer
    name: Native Engineer
    skills:
      - aidlc-native-build-plan
      - aidlc-native-implement
    model: opus
    description: native-engineer persona — handles build-plan, implement
    capabilities:
      - github
      - files
  - id: aidlc-native-verifier
    name: Native Verifier
    skills:
      - aidlc-native-verify
    model: sonnet
    description: native-verifier persona — handles verify
    capabilities:
      - github
      - files
  - id: aidlc-native-reviewer
    name: Native Reviewer
    skills:
      - aidlc-native-review
    model: sonnet
    description: native-reviewer persona — handles review
    capabilities:
      - github
      - files
  - id: aidlc-native-operator
    name: Native Operator
    skills:
      - aidlc-native-maintain
    model: sonnet
    description: native-operator persona — handles maintain
    capabilities:
      - github
      - files
skills:
  - id: aidlc-native-intent
    path: ~/.claude/skills/aidlc-native-intent.md
  - id: aidlc-native-spec
    path: ~/.claude/skills/aidlc-native-spec.md
  - id: aidlc-native-build-plan
    path: ~/.claude/skills/aidlc-native-build-plan.md
  - id: aidlc-native-implement
    path: ~/.claude/skills/aidlc-native-implement.md
  - id: aidlc-native-verify
    path: ~/.claude/skills/aidlc-native-verify.md
  - id: aidlc-native-review
    path: ~/.claude/skills/aidlc-native-review.md
  - id: aidlc-native-maintain
    path: ~/.claude/skills/aidlc-native-maintain.md
environment: {}
slash_commands:
  - name: /ai-native-full-intent
    agent: aidlc-native-originator
  - name: /ai-native-full-spec
    agent: aidlc-native-product-owner
  - name: /ai-native-full-build-plan
    agent: aidlc-native-engineer
  - name: /ai-native-full-implement
    agent: aidlc-native-engineer
  - name: /ai-native-full-verify
    agent: aidlc-native-verifier
  - name: /ai-native-full-review
    agent: aidlc-native-reviewer
  - name: /ai-native-full-maintain
    agent: aidlc-native-operator
pipelines:
  - id: ai-native-full
    steps:
      - name: intent
        agent: aidlc-native-originator
        skills:
          - aidlc-native-intent
        enabled: true
        requires: []
        produces:
          - docs/epics/{epic}/artifacts/intent.md
        human_review: true
        auto_review: false
      - name: spec
        agent: aidlc-native-product-owner
        skills:
          - aidlc-native-spec
        enabled: true
        requires: []
        produces:
          - docs/epics/{epic}/artifacts/spec.md
        human_review: true
        auto_review: false
        depends_on:
          - intent
      - name: build-plan
        agent: aidlc-native-engineer
        skills:
          - aidlc-native-build-plan
        enabled: true
        requires: []
        produces:
          - docs/epics/{epic}/artifacts/plan.md
        human_review: true
        auto_review: false
        depends_on:
          - spec
      - name: implement
        agent: aidlc-native-engineer
        skills:
          - aidlc-native-implement
        enabled: true
        requires: []
        produces:
          - docs/epics/{epic}/artifacts/implement.md
        human_review: true
        auto_review: false
        depends_on:
          - build-plan
      - name: verify
        agent: aidlc-native-verifier
        skills:
          - aidlc-native-verify
        enabled: true
        requires: []
        produces:
          - docs/epics/{epic}/artifacts/verify.md
        human_review: true
        auto_review: false
        depends_on:
          - implement
      - name: review
        agent: aidlc-native-reviewer
        skills:
          - aidlc-native-review
        enabled: true
        requires: []
        produces:
          - docs/epics/{epic}/artifacts/review.md
        human_review: true
        auto_review: false
        depends_on:
          - verify
      - name: maintain
        agent: aidlc-native-operator
        skills:
          - aidlc-native-maintain
        enabled: true
        requires: []
        produces:
          - docs/epics/{epic}/artifacts/incident.md
        human_review: false
        auto_review: false
        depends_on:
          - review
    on_failure: stop
recipes:
  - id: native-quick
    description: Small, well-understood change — intent straight to plan, no separate spec.
    from: ai-native-full
    steps:
      - intent
      - build-plan
      - implement
      - verify
  - id: native-lite
    description: >-
      Small change with a precedent already in the codebase — no spec, no separate verify. The human gates sit up front,
      on intent and build-plan, where a wrong direction is cheapest to correct; implement and review then run to the end
      unattended. Trade-off: review is the only quality gate left, and nobody reads it before the branch is finished — a
      hold verdict stops the run, but prefer native-fix when the change has no precedent to follow.
    from: ai-native-full
    steps:
      - intent
      - build-plan
      - implement
      - review
    gates:
      intent:
        human_review: true
      build-plan:
        human_review: true
      implement:
        human_review: false
      review:
        human_review: false
        auto_review: true
        auto_review_runner: .aidlc/validators/verdict.mjs
  - id: native-autopilot
    description: >-
      Left to run on its own once the plan is approved — no spec. A person approves intent and build-plan, then
      implement, verify and review run unattended: CI checks implement, and a failed verify or a review hold sends the
      work back to implement on its own, up to three times. The run stops at review for a person to approve the finished
      branch. Needs a branch of its own, the approval-gate hook and real CHECKS in .aidlc/validators/ci.mjs.
    from: ai-native-full
    steps:
      - intent
      - build-plan
      - implement
      - verify
      - review
    gates:
      intent:
        human_review: true
        timeout_minutes: 20
      build-plan:
        human_review: true
        timeout_minutes: 20
      implement:
        human_review: false
        auto_review: true
        auto_review_runner: .aidlc/validators/ci.mjs
        batches: true
        timeout_minutes: 30
      verify:
        human_review: false
        auto_review: true
        auto_review_runner: .aidlc/validators/verdict.mjs
        on_reject:
          send_back_to: implement
        timeout_minutes: 20
      review:
        human_review: true
        auto_review: true
        auto_review_runner: .aidlc/validators/verdict.mjs
        on_reject:
          send_back_to: implement
        timeout_minutes: 20
    autopilot: true
    max_send_backs: 3
  - id: native-fix
    description: >-
      Bug fix / refactor / tech debt — no spec (there is no new behaviour to specify), but both quality gates kept:
      verify then review.
    from: ai-native-full
    steps:
      - intent
      - build-plan
      - implement
      - verify
      - review
  - id: native-full
    description: "Full AI-Native flow: intent → spec → build-plan → implement → verify → review."
    from: ai-native-full
    steps:
      - intent
      - spec
      - build-plan
      - implement
      - verify
      - review
  - id: native-hotfix
    description: >-
      Production is burning and the cause is already known — straight to plan, ship, review. Trade-off: no intent.md
      means the engineer starts with only the epic description as context, and skipping verify removes the independent
      check exactly when haste makes errors likeliest. Prefer native-fix unless the clock genuinely forbids it.
    from: ai-native-full
    steps:
      - build-plan
      - implement
      - review
  - id: native-align
    description: Agree on scope before engineering starts — stop once acceptance criteria exist, write no code.
    from: ai-native-full
    steps:
      - intent
      - spec
  - id: native-spike
    description: Capture the problem only — no spec, no code.
    from: ai-native-full
    steps:
      - intent
  - id: native-audit
    description: Judge a diff that already exists against policy — no epic work, review only.
    from: ai-native-full
    steps:
      - review
  - id: native-incident
    description: A production signal arrived — diagnose it and open the follow-up epic.
    from: ai-native-full
    steps:
      - maintain
sidebar:
  views:
    - type: agents-list
    - type: skills-list
    - type: pipelines-list
